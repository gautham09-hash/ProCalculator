name: Build Android APK with Qt Toolchain
on: 
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install aqtinstall
        run: pip install aqtinstall

      - name: Install Qt for Android
        run: |
          python -m aqt install-qt linux android 6.5.3 android_arm64_v8a -O /opt/qt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK via Qt CMake wrapper
        run: |
          mkdir build && cd build
          /opt/qt/6.5.3/android_arm64_v8a/bin/qt-cmake .. \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_NATIVE_API_LEVEL=23
          cmake --build .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProCalculator-Android
          path: build/**/*.apk
